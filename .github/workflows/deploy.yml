name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nicolasmilosevic-redesign/package-lock.json
      # The live site is the Next.js redesign, exported as static HTML to out/
      - run: npm ci
        working-directory: nicolasmilosevic-redesign
      - run: npm run build
        working-directory: nicolasmilosevic-redesign
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nicolasmilosevic-redesign/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
